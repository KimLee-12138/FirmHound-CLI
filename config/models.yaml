# Model runtime configuration.
# 决赛环境：使用国内备案模型，OpenAI-compatible 端点。

runtimes:
  mock:
    provider: mock
    description: Rule-based offline runtime, no external calls.

  openai_compatible:
    provider: openai
    base_url: https://api.deepseek.com/v1
    model: deepseek-chat
    timeout: 60
    max_retries: 3
    # api_key loaded from env var OPENAI_API_KEY by default.
    api_key_env: OPENAI_API_KEY

budgets:
  default:
    max_total_tokens: 100000
    max_tokens_per_stage: 20000
    max_model_calls_per_stage: 50
    max_total_duration_seconds: 3600
  quick:
    max_total_tokens: 20000
    max_tokens_per_stage: 5000
    max_model_calls_per_stage: 10
    max_total_duration_seconds: 900
